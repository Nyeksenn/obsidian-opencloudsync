# Throwaway OpenCloud server for local plugin development. NOT for production.
#
#   podman-compose up -d        # then open https://localhost:8080  (admin / admin)
#   podman-compose down -v      # stop and wipe all config + data
#
# WebDAV root for the plugin: https://localhost:8080/remote.php/dav/files/admin/
#
# - TLS is a self-signed certificate generated by OpenCloud: the built-in IDP refuses to start
#   unless OC_URL is https://, so plain HTTP is not an option without an external proxy.
# - The listen port, published port and OC_URL must all agree, or login ends in /access-denied.
# - Basic auth (username + password over WebDAV) is enabled for development; OpenCloud disables it by default.
# - Named volumes keep ownership right under rootless Podman (the image runs as uid 1000).

services:
  opencloud:
    image: docker.io/opencloudeu/opencloud-rolling:latest
    container_name: opencloud-dev
    # The first start writes /etc/opencloud/opencloud.yaml; later starts reuse it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f /etc/opencloud/opencloud.yaml ] || opencloud init --insecure yes --admin-password "$$IDM_ADMIN_PASSWORD"
        exec opencloud server
    environment:
      OC_URL: https://localhost:8080
      PROXY_HTTP_ADDR: 0.0.0.0:8080
      OC_INSECURE: "true"
      PROXY_ENABLE_BASIC_AUTH: "true"
      IDM_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - opencloud-config:/etc/opencloud
      - opencloud-data:/var/lib/opencloud
    restart: unless-stopped

volumes:
  opencloud-config:
  opencloud-data:
