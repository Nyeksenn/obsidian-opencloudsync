# Throwaway OpenCloud server for local plugin development. NOT for production.
#
#   podman-compose up -d        # API and WebDAV on http://localhost:8080
#   podman exec opencloud-dev opencloud auth-app create --user-name=admin --expiration=720h
#                               # prints the app token the plugin uses as its "App token"
#   podman-compose down -v      # stop and wipe all config + data
#
# Plugin settings: Server URL http://localhost:8080, Username admin, App token = the token above.
#
# - Plain HTTP, so Obsidian needs no certificate trust. OpenCloud's built-in login service (IDP) refuses to start unless
#   OC_URL is https://, so it is switched off (OC_EXCLUDE_RUN_SERVICES=idp). The plugin does not need it: it signs in
#   with an app token over basic auth. The cost: the web UI cannot log in. Inspect files with curl or the plugin.
# - The listen port, published port and OC_URL must all agree.
# - Named volumes keep ownership right under rootless Podman (the image runs as uid 1000).

services:
  opencloud:
    image: docker.io/opencloudeu/opencloud-rolling:latest
    container_name: opencloud-dev
    # The first start writes /etc/opencloud/opencloud.yaml; later starts reuse it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f /etc/opencloud/opencloud.yaml ] || opencloud init --insecure yes --admin-password "$$IDM_ADMIN_PASSWORD"
        exec opencloud server
    environment:
      OC_URL: http://localhost:8080
      PROXY_HTTP_ADDR: 0.0.0.0:8080
      PROXY_TLS: "false"
      OC_INSECURE: "true"
      OC_EXCLUDE_RUN_SERVICES: idp
      IDM_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - opencloud-config:/etc/opencloud
      - opencloud-data:/var/lib/opencloud
    restart: unless-stopped

volumes:
  opencloud-config:
  opencloud-data:
